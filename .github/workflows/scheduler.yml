name: Masterclass reminders (scheduler fallback)

# Hostinger's hPanel cron is not executing for this account, so the Laravel
# scheduler never ticks. This runs the masterclass reminder command directly
# on the server on a cadence. The command is window-based and idempotent
# (each registrant is stamped once per event), so it's safe to fire often and
# tolerant of GitHub's cron delays — it only acts inside the 24h/2h/post-session
# windows and does nothing otherwise.

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min (UTC); the command decides if it's time to send
  workflow_dispatch: {}       # manual "run now" from the Actions tab

# Don't let a slow run overlap the next tick.
concurrency:
  group: masterclass-scheduler
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and run masterclass:remind
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            set -e
            cd ~/domains/ajbuildai.com/public_html/laravel
            php artisan masterclass:remind
